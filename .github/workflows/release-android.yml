name: release-android

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Valida tag contra a versão do pubspec
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')"
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "Tag $GITHUB_REF_NAME diverge do pubspec ($pubspec_version)"
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # O pin local de JDK (caminho Windows) quebra o Gradle no runner Linux.
      - name: Remove pin de JDK local só neste checkout
        run: sed -i '/^org.gradle.java.home/d' android/gradle.properties

      - name: Monta assinatura e config do Firebase a partir dos secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter build appbundle --release

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.caiodeiro.calcclt
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Remove arquivos sensíveis
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties android/app/google-services.json
