appId: com.caiodeiro.calcclt
name: Férias vencidas em dobro com aviso de validação e tabela de períodos
tags: [calculation, regression]
env:
  SALARY: "300000"
  # Admissão 01/01/2022 e rescisão 15/06/2025 (subfluxo): 3 períodos completos,
  # o 1º com concessivo encerrado em 01/01/2025, logo em dobro se nenhum foi gozado.
  ADMISSION: "01012022"
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/skip_onboarding.yaml
- tapOn:
    id: "home_type_withoutJustCause"
    label: "Sem Justa Causa"
- tapOn:
    id: "form_admission_date"
- inputText: ${ADMISSION}
- tapOn:
    id: "form_termination_date"
- inputText: "15062025"
- scrollUntilVisible:
    element:
      id: "form_vacation_taken"
    label: "Campo de períodos de férias gozados"
- assertVisible:
    id: "form_vacation_warning"
    label: "Aviso de férias fracionadas/abono visível junto ao campo"
- tapOn:
    id: "form_vacation_taken_decrement"
    label: "Diminui para 2"
- tapOn:
    id: "form_vacation_taken_decrement"
    label: "Diminui para 1"
- tapOn:
    id: "form_vacation_taken_decrement"
    label: "Diminui para 0 gozados"
- tapOn:
    id: "form_base_salary"
- inputText: ${SALARY}
- tapOn:
    id: "form_calculate_button"
    label: "Calcular"
- extendedWaitUntil:
    visible:
      id: "result_paid_total"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Férias em Dobro.*"
    label: "Linha de férias em dobro (indenização)"
- assertVisible:
    id: "result_validation_notice"
    label: "Aviso de cálculo em validação"
- scrollUntilVisible:
    element:
      id: "result_assumptions_toggle"
- tapOn:
    id: "result_assumptions_toggle"
    label: "Abre as premissas"
- scrollUntilVisible:
    element:
      id: "result_assumption_vacationPeriods"
- assertVisible:
    id: "result_assumption_vacationPeriods"
    label: "Tabela de períodos presente"
- assertVisible:
    text: ".*dobro.*"
    label: "Tabela cita o período em dobro"
